[project]
name = "climate-hazard-backend"
version = "0.1.0"
description = "Climate Hazard Analyzer backend connectivity and weather boundaries"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.136.3,<0.137",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.12.5,<3",
  "pymongo>=4.13,<5",
  "python-dotenv>=1.2.1,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
